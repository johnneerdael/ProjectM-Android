name: Android CI/CD

# Main is always fully validated before publication. PRs use pr-builds.yml after review.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: android-main
  queue: max
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: read

jobs:
  validate-fdroid-token:
    name: Validate F-Droid synchronization permissions
    # Explicitly requested credential check on this trusted owner-created feature branch.
    # All publication/build jobs below remain main-only.
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/feat/fdroid-distribution'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify scope and temporary branch creation/deletion
        env:
          FDROID_GITLAB_TOKEN: ${{ secrets.FDROID_GITLAB_TOKEN }}
        run: python3 .github/scripts/validate_fdroid_token.py --diagnose --write-probe

  build:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/android-build.yml
    secrets:
      SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
      SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
      SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
      SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}

  presets:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/preset-lab.yml

  docs:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/docs-build.yml

  release:
    name: Publish GitHub Release
    needs: [build, presets, docs]
    if: needs.build.outputs.release == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: apk
          path: dist

      - uses: actions/download-artifact@v4
        with:
          name: core-aar
          path: dist

      - uses: actions/download-artifact@v4
        with:
          name: mapping
          path: dist

      - name: Write release notes from merged PRs
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
          PREVIOUS_TAG: ${{ needs.build.outputs.previous_tag }}
        run: >-
          python3 .github/scripts/release_notes.py generate
          --checkout . --repo "$GITHUB_REPOSITORY" --sha "$GITHUB_SHA"
          --version "$VERSION" --previous-tag "$PREVIOUS_TAG" --output notes.md --with-fdroid

      - name: Publish complete signed artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
          APK_NAME: ${{ needs.build.outputs.apk_name }}
          ANDROID_APK_NAME: ${{ needs.build.outputs.android_apk_name }}
          FDROID_TV_APK_NAME: ${{ needs.build.outputs.fdroid_tv_apk_name }}
          FDROID_ANDROID_APK_NAME: ${{ needs.build.outputs.fdroid_android_apk_name }}
          AAR_NAME: ${{ needs.build.outputs.aar_name }}
        run: |
          cp "dist/$APK_NAME" dist/projectM-TV.apk
          cp "dist/$ANDROID_APK_NAME" dist/projectM-Android.apk
          cp "dist/$FDROID_TV_APK_NAME" dist/projectM-TV-FDroid.apk
          cp "dist/$FDROID_ANDROID_APK_NAME" dist/projectM-Android-FDroid.apk
          cp "dist/$AAR_NAME" dist/projectM-TV-core.aar
          python3 .github/scripts/publish_release.py publish --repo "$GITHUB_REPOSITORY" \
            --version "$VERSION" --sha "$GITHUB_SHA" --notes notes.md --assets-dir dist --with-touchscreen --with-fdroid

  milkbeat:
    name: Rebuild Milkbeat with this core
    needs: [build, release]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Update Milkbeat with this core
        env:
          GH_TOKEN: ${{ secrets.MILKBEAT_TOKEN }}
          VERSION: ${{ needs.build.outputs.version }}
        run: python3 .github/scripts/publish_release.py milkbeat --version "$VERSION"

  deploy-guide:
    if: github.ref == 'refs/heads/main'
    needs: [build, presets, docs]
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages-deploy.yml
