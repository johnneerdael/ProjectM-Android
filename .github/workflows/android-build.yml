name: Android build

on:
  workflow_call:
    inputs:
      source_ref:
        type: string
        default: ''
      pr_build:
        type: boolean
        default: false
    secrets:
      SIGNING_KEYSTORE_BASE64:
        required: false
      SIGNING_STORE_PASSWORD:
        required: false
      SIGNING_KEY_ALIAS:
        required: false
      SIGNING_KEY_PASSWORD:
        required: false
    outputs:
      version:
        value: ${{ jobs.apk.outputs.version }}
      version_code:
        value: ${{ jobs.apk.outputs.version_code }}
      tag:
        value: ${{ jobs.apk.outputs.tag }}
      release:
        value: ${{ jobs.apk.outputs.release }}
      apk_name:
        value: ${{ jobs.apk.outputs.apk_name }}
      android_apk_name:
        value: ${{ jobs.apk.outputs.android_apk_name }}
      fdroid_tv_apk_name:
        value: ${{ jobs.apk.outputs.fdroid_tv_apk_name }}
      fdroid_android_apk_name:
        value: ${{ jobs.apk.outputs.fdroid_android_apk_name }}
      aar_name:
        value: ${{ jobs.apk.outputs.aar_name }}
      previous_tag:
        value: ${{ jobs.apk.outputs.previous_tag }}
      release_sha:
        value: ${{ jobs.apk.outputs.release_sha }}
      source_sha:
        value: ${{ jobs.apk.outputs.source_sha }}

permissions:
  contents: read

jobs:
  native-tests:
    name: Native engine tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          persist-credentials: false
          submodules: recursive  # projectM is built from source (third_party/projectm)
      - name: Test release tooling
        run: |
          python3 -m venv "$RUNNER_TEMP/fdroid-venv"
          "$RUNNER_TEMP/fdroid-venv/bin/pip" install -r tools/fdroid/requirements.txt
          "$RUNNER_TEMP/fdroid-venv/bin/python" -m unittest discover -s .github/scripts/tests -v
      - name: Lint both F-Droid recipes without credentials
        working-directory: tools/fdroid
        run: >-
          "$RUNNER_TEMP/fdroid-venv/bin/fdroid" lint -f nl.neerdael.projectmtv nl.neerdael.projectm
      - name: Test diagnostics options
        run: python3 -m unittest discover -s tools -p test_tv_diagnostics.py -v
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'  # same major as F-Droid's build server (OpenJDK 21), for reproducible builds
      - name: Check the preset index (names and memory weights) is up to date
        run: tools/gen-preset-index.py --check
      - name: Check presets (audio-reactive, no excluded or missing textures)
        run: tools/check-presets.py
      - name: Install Mesa (headless OpenGL ES 3 for the transition overlay test)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends libegl-dev libgles-dev libegl-mesa0 libgl1-mesa-dri pkg-config > /dev/null
      - name: Run host tests (ASan/UBSan)
        run: core/src/test/native/run_native_tests.sh

  apk:
    name: Build APK
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      version: ${{ steps.version.outputs.version }}
      version_code: ${{ steps.version.outputs.version_code }}
      tag: ${{ steps.version.outputs.tag }}
      release: ${{ steps.version.outputs.release }}
      apk_name: ${{ steps.apk.outputs.name }}
      android_apk_name: ${{ steps.android_apk.outputs.name }}
      fdroid_tv_apk_name: ${{ steps.fdroid_tv_apk.outputs.name }}
      fdroid_android_apk_name: ${{ steps.fdroid_android_apk.outputs.name }}
      aar_name: ${{ steps.aar.outputs.name }}
      previous_tag: ${{ steps.version.outputs.previous_tag }}
      release_sha: ${{ steps.release_source.outputs.release_sha }}
      source_sha: ${{ steps.release_source.outputs.source_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          persist-credentials: false
          fetch-depth: 0
          filter: blob:none  # Keep release history/tags; fetch current files on checkout.
          submodules: recursive  # projectM is built from source (third_party/projectm)

      - name: Determine version
        id: version
        env:
          SOURCE_SHA: ${{ inputs.source_ref || github.sha }}
          SOURCE_EVENT: ${{ inputs.pr_build && 'pull_request' || github.event_name }}
        run: >-
          python3 .github/scripts/release_version.py
          --repo . --sha "$SOURCE_SHA" --event "$SOURCE_EVENT" --ref "$GITHUB_REF"
          --run-number "$GITHUB_RUN_NUMBER" --output "$GITHUB_OUTPUT" --env "$GITHUB_ENV"

      # Build from the commit the release tag will point at: main plus gradle.properties
      # declaring this version and code, so the tagged source states its own version.
      - name: Check out the version-declaring release source
        id: release_source
        env:
          SOURCE_SHA: ${{ inputs.source_ref || github.sha }}
        run: |
          python3 .github/scripts/release_commit.py create --repo . --source "$SOURCE_SHA" \
            --version "$PROJECTM_RELEASE_VERSION" --version-code "$PROJECTM_RELEASE_VERSION_CODE" \
            --checkout --output "$GITHUB_OUTPUT"
          echo "PROJECTM_SOURCE_SHA=$(git rev-parse HEAD^)" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'  # same major as F-Droid's build server (OpenJDK 21), for reproducible builds

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: ${{ inputs.pr_build }}

      - name: Prepare Android SDK
        run: |
          # The committed local.properties points at a developer machine.
          echo "sdk.dir=${ANDROID_HOME}" > local.properties
          yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --install \
            "cmake;3.22.1" "ndk;27.3.13750724" "platforms;android-34" > /dev/null

      - name: Configure release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "${KEYSTORE_BASE64}" ]; then
            echo "${KEYSTORE_BASE64}" | base64 -d > "${RUNNER_TEMP}/release.jks"
            echo "SIGNING_KEYSTORE_PATH=${RUNNER_TEMP}/release.jks" >> "$GITHUB_ENV"
          elif [ "${{ steps.version.outputs.release }}" = "true" ]; then
            echo "::error::Release signing is unavailable; refusing to publish a debug-signed APK."
            exit 1
          else
            echo "CI artifact uses a temporary debug key."
          fi

      - name: JVM unit tests
        run: ./gradlew testReleaseUnitTest --no-daemon

      - name: Build release APK and native core AAR
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: ./gradlew assembleRelease -PprojectmCoreRenderingPolicy=native --no-daemon --stacktrace

      - name: Name APK
        id: apk
        run: |
          SHORT_SHA=$(git rev-parse --short "$PROJECTM_SOURCE_SHA")
          if [ "${{ steps.version.outputs.release }}" = "true" ]; then
            NAME="projectM-TV-${{ steps.version.outputs.version }}.apk"
          else
            NAME="projectM-TV-${{ steps.version.outputs.version }}-ci.${GITHUB_RUN_NUMBER}-${SHORT_SHA}.apk"
          fi
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/${NAME}"
          # R8 obfuscates the release; this maps its crash traces back to source names (retrace).
          mkdir -p dist-mapping
          cp app/build/outputs/mapping/release/mapping.txt "dist-mapping/${NAME%.apk}-mapping.txt"
          echo "name=${NAME}" >> "$GITHUB_OUTPUT"
          ls -lh dist dist-mapping

      - name: Name core AAR
        id: aar
        run: |
          # Stage the same Native core embedded by the APK under canonical integration names.
          SHORT_SHA=$(git rev-parse --short "$PROJECTM_SOURCE_SHA")
          if [ "${{ steps.version.outputs.release }}" = "true" ]; then
            NAME="projectM-TV-core-${{ steps.version.outputs.version }}.aar"
          else
            NAME="projectM-TV-core-${{ steps.version.outputs.version }}-ci.${GITHUB_RUN_NUMBER}-${SHORT_SHA}.aar"
          fi
          mkdir -p dist-aar
          cp core/build/outputs/aar/core-release.aar "dist-aar/${NAME}"
          echo "name=${NAME}" >> "$GITHUB_OUTPUT"
          ls -lh dist-aar

      - name: JVM unit tests for touchscreen build
        run: ./gradlew :app:testReleaseUnitTest -PandroidTouchscreen=true --no-daemon

      - name: Build release APK for touchscreen Android
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease -PandroidTouchscreen=true --no-daemon --stacktrace

      - name: Name Android APK
        id: android_apk
        run: |
          SHORT_SHA=$(git rev-parse --short "$PROJECTM_SOURCE_SHA")
          if [ "${{ steps.version.outputs.release }}" = "true" ]; then
            NAME="projectM-Android-${{ steps.version.outputs.version }}.apk"
          else
            NAME="projectM-Android-${{ steps.version.outputs.version }}-ci.${GITHUB_RUN_NUMBER}-${SHORT_SHA}.apk"
          fi
          cp app/build/outputs/apk/release/app-release.apk "dist/${NAME}"
          cp app/build/outputs/mapping/release/mapping.txt "dist-mapping/${NAME%.apk}-mapping.txt"
          echo "name=${NAME}" >> "$GITHUB_OUTPUT"

      - name: Generate verified official collection and release metadata
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          STABLE_VERSION="${VERSION%%-*}"
          python3 tools/preset_distribution.py build --root . \
            --selection tools/preset-distribution/starter-presets.json --output dist-collection \
            --release-tag "v${STABLE_VERSION}" --archive
          cp "dist-collection/cream-of-the-crop-${STABLE_VERSION}.zip" dist/
          python3 .github/scripts/publish_release.py manifest --version "$STABLE_VERSION" \
            --version-code "$PROJECTM_RELEASE_VERSION_CODE" --sha "${{ steps.release_source.outputs.release_sha }}" \
            --collection-lock tools/preset-distribution/official-archive.json --output dist/release-version.json

      - name: JVM unit tests for F-Droid TV
        run: ./gradlew :app:testFdroidTvReleaseUnitTest -PprojectmDistribution=fdroid --no-daemon

      - name: Build release APK for F-Droid TV
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: ./gradlew :app:assembleFdroidTvRelease -PprojectmDistribution=fdroid --no-daemon --stacktrace

      - name: Name F-Droid TV APK
        id: fdroid_tv_apk
        run: |
          SHORT_SHA=$(git rev-parse --short "$PROJECTM_SOURCE_SHA")
          if [ "${{ steps.version.outputs.release }}" = "true" ]; then
            NAME="projectM-TV-FDroid-${{ steps.version.outputs.version }}.apk"
          else
            NAME="projectM-TV-FDroid-${{ steps.version.outputs.version }}-ci.${GITHUB_RUN_NUMBER}-${SHORT_SHA}.apk"
          fi
          cp app/build/outputs/apk/fdroidTv/release/app-fdroidTv-release.apk "dist/${NAME}"
          cp app/build/outputs/mapping/fdroidTvRelease/mapping.txt "dist-mapping/${NAME%.apk}-mapping.txt"
          echo "name=${NAME}" >> "$GITHUB_OUTPUT"

      - name: JVM unit tests for F-Droid Android
        run: ./gradlew :app:testFdroidAndroidReleaseUnitTest -PprojectmDistribution=fdroid -PandroidTouchscreen=true --no-daemon

      - name: Build release APK for F-Droid Android
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: ./gradlew :app:assembleFdroidAndroidRelease -PprojectmDistribution=fdroid -PandroidTouchscreen=true --no-daemon --stacktrace

      - name: Name F-Droid Android APK
        id: fdroid_android_apk
        run: |
          SHORT_SHA=$(git rev-parse --short "$PROJECTM_SOURCE_SHA")
          if [ "${{ steps.version.outputs.release }}" = "true" ]; then
            NAME="projectM-Android-FDroid-${{ steps.version.outputs.version }}.apk"
          else
            NAME="projectM-Android-FDroid-${{ steps.version.outputs.version }}-ci.${GITHUB_RUN_NUMBER}-${SHORT_SHA}.apk"
          fi
          cp app/build/outputs/apk/fdroidAndroid/release/app-fdroidAndroid-release.apk "dist/${NAME}"
          cp app/build/outputs/mapping/fdroidAndroidRelease/mapping.txt "dist-mapping/${NAME%.apk}-mapping.txt"
          echo "name=${NAME}" >> "$GITHUB_OUTPUT"

      - name: Verify all packaged distributions and the staged full core
        env:
          TV_APK: ${{ steps.apk.outputs.name }}
          ANDROID_APK: ${{ steps.android_apk.outputs.name }}
          FDROID_TV_APK: ${{ steps.fdroid_tv_apk.outputs.name }}
          FDROID_ANDROID_APK: ${{ steps.fdroid_android_apk.outputs.name }}
          CORE_AAR: ${{ steps.aar.outputs.name }}
          RELEASE: ${{ steps.version.outputs.release }}
        run: |
          python3 .github/scripts/check_distribution_artifacts.py --apk "dist/$TV_APK" \
            --distribution github --target tv --version "${PROJECTM_RELEASE_VERSION}${VERSION_SUFFIX}" \
            --version-code "$PROJECTM_RELEASE_VERSION_CODE" --core-aar "dist-aar/$CORE_AAR"
          python3 .github/scripts/check_distribution_artifacts.py --apk "dist/$ANDROID_APK" \
            --distribution github --target android --version "${PROJECTM_RELEASE_VERSION}${VERSION_SUFFIX}" \
            --version-code "$PROJECTM_RELEASE_VERSION_CODE"
          QUALIFICATION=""
          if [ "$RELEASE" = "true" ]; then QUALIFICATION="--require-qualified"; fi
          python3 .github/scripts/check_distribution_artifacts.py --apk "dist/$FDROID_TV_APK" \
            --distribution fdroid --target tv --version "${PROJECTM_RELEASE_VERSION}${VERSION_SUFFIX}" \
            --version-code "$PROJECTM_RELEASE_VERSION_CODE" ${QUALIFICATION:+"$QUALIFICATION"}
          python3 .github/scripts/check_distribution_artifacts.py --apk "dist/$FDROID_ANDROID_APK" \
            --distribution fdroid --target android --version "${PROJECTM_RELEASE_VERSION}${VERSION_SUFFIX}" \
            --version-code "$PROJECTM_RELEASE_VERSION_CODE" ${QUALIFICATION:+"$QUALIFICATION"}

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: dist/*
          retention-days: 30
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: core-aar
          path: dist-aar/*.aar
          retention-days: 30
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: mapping
          path: dist-mapping/*-mapping.txt
          retention-days: 30
          if-no-files-found: error

