name: Android build

on:
  workflow_call:
    inputs:
      source_ref:
        type: string
        default: ''
      pr_build:
        type: boolean
        default: false
    secrets:
      SIGNING_KEYSTORE_BASE64:
        required: false
      SIGNING_STORE_PASSWORD:
        required: false
      SIGNING_KEY_ALIAS:
        required: false
      SIGNING_KEY_PASSWORD:
        required: false
    outputs:
      version:
        value: ${{ jobs.apk.outputs.version }}
      tag:
        value: ${{ jobs.apk.outputs.tag }}
      release:
        value: ${{ jobs.apk.outputs.release }}
      apk_name:
        value: ${{ jobs.apk.outputs.apk_name }}
      android_apk_name:
        value: ${{ jobs.apk.outputs.android_apk_name }}
      aar_name:
        value: ${{ jobs.apk.outputs.aar_name }}
      previous_tag:
        value: ${{ jobs.apk.outputs.previous_tag }}

permissions:
  contents: read

jobs:
  native-tests:
    name: Native engine tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          persist-credentials: false
          submodules: recursive  # projectM is built from source (third_party/projectm)
      - name: Test release tooling
        run: |
          python3 -m venv "$RUNNER_TEMP/fdroid-venv"
          "$RUNNER_TEMP/fdroid-venv/bin/pip" install -r tools/fdroid/requirements.txt
          "$RUNNER_TEMP/fdroid-venv/bin/python" -m unittest discover -s .github/scripts/tests -v
      - name: Test diagnostics options
        run: python3 -m unittest discover -s tools -p test_tv_diagnostics.py -v
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'  # same major as F-Droid's build server (OpenJDK 21), for reproducible builds
      - name: Check the preset index (names and memory weights) is up to date
        run: tools/gen-preset-index.py --check
      - name: Check presets (audio-reactive, no excluded or missing textures)
        run: tools/check-presets.py
      - name: Install Mesa (headless OpenGL ES 3 for the transition overlay test)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends libegl-dev libgles-dev libegl-mesa0 libgl1-mesa-dri pkg-config > /dev/null
      - name: Run host tests (ASan/UBSan)
        run: core/src/test/native/run_native_tests.sh

  apk:
    name: Build APK
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      release: ${{ steps.version.outputs.release }}
      apk_name: ${{ steps.apk.outputs.name }}
      android_apk_name: ${{ steps.android_apk.outputs.name }}
      aar_name: ${{ steps.aar.outputs.name }}
      previous_tag: ${{ steps.version.outputs.previous_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          persist-credentials: false
          fetch-depth: 0
          filter: blob:none  # Keep release history/tags; fetch current files on checkout.
          submodules: recursive  # projectM is built from source (third_party/projectm)

      - name: Determine version
        id: version
        env:
          SOURCE_SHA: ${{ inputs.source_ref || github.sha }}
          SOURCE_EVENT: ${{ inputs.pr_build && 'pull_request' || github.event_name }}
        run: >-
          python3 .github/scripts/release_version.py
          --repo . --sha "$SOURCE_SHA" --event "$SOURCE_EVENT" --ref "$GITHUB_REF"
          --run-number "$GITHUB_RUN_NUMBER" --output "$GITHUB_OUTPUT" --env "$GITHUB_ENV"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'  # same major as F-Droid's build server (OpenJDK 21), for reproducible builds

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: ${{ inputs.pr_build }}

      - name: Prepare Android SDK
        run: |
          # The committed local.properties points at a developer machine.
          echo "sdk.dir=${ANDROID_HOME}" > local.properties
          yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --install \
            "cmake;3.22.1" "ndk;27.3.13750724" "platforms;android-34" > /dev/null

      - name: Configure release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "${KEYSTORE_BASE64}" ]; then
            echo "${KEYSTORE_BASE64}" | base64 -d > "${RUNNER_TEMP}/release.jks"
            echo "SIGNING_KEYSTORE_PATH=${RUNNER_TEMP}/release.jks" >> "$GITHUB_ENV"
          elif [ "${{ steps.version.outputs.release }}" = "true" ]; then
            echo "::error::Release signing is unavailable; refusing to publish a debug-signed APK."
            exit 1
          else
            echo "CI artifact uses a temporary debug key."
          fi

      - name: JVM unit tests
        run: ./gradlew testReleaseUnitTest --no-daemon

      - name: Build release APK and native core AAR
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: ./gradlew assembleRelease -PprojectmCoreRenderingPolicy=native --no-daemon --stacktrace

      - name: Name APK
        id: apk
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          if [ "${{ steps.version.outputs.release }}" = "true" ]; then
            NAME="projectM-TV-${{ steps.version.outputs.version }}.apk"
          else
            NAME="projectM-TV-${{ steps.version.outputs.version }}-ci.${GITHUB_RUN_NUMBER}-${SHORT_SHA}.apk"
          fi
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/${NAME}"
          # R8 obfuscates the release; this maps its crash traces back to source names (retrace).
          mkdir -p dist-mapping
          cp app/build/outputs/mapping/release/mapping.txt "dist-mapping/${NAME%.apk}-mapping.txt"
          echo "name=${NAME}" >> "$GITHUB_OUTPUT"
          ls -lh dist dist-mapping

      - name: Name core AAR
        id: aar
        run: |
          # Stage the same Native core embedded by the APK under canonical integration names.
          SHORT_SHA=$(git rev-parse --short HEAD)
          if [ "${{ steps.version.outputs.release }}" = "true" ]; then
            NAME="projectM-TV-core-${{ steps.version.outputs.version }}.aar"
          else
            NAME="projectM-TV-core-${{ steps.version.outputs.version }}-ci.${GITHUB_RUN_NUMBER}-${SHORT_SHA}.aar"
          fi
          mkdir -p dist-aar
          cp core/build/outputs/aar/core-release.aar "dist-aar/${NAME}"
          echo "name=${NAME}" >> "$GITHUB_OUTPUT"
          ls -lh dist-aar

      - name: JVM unit tests for touchscreen build
        run: ./gradlew :app:testReleaseUnitTest -PandroidTouchscreen=true --no-daemon

      - name: Build release APK for touchscreen Android
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease -PandroidTouchscreen=true --no-daemon --stacktrace

      - name: Name Android APK
        id: android_apk
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          if [ "${{ steps.version.outputs.release }}" = "true" ]; then
            NAME="projectM-Android-${{ steps.version.outputs.version }}.apk"
          else
            NAME="projectM-Android-${{ steps.version.outputs.version }}-ci.${GITHUB_RUN_NUMBER}-${SHORT_SHA}.apk"
          fi
          cp app/build/outputs/apk/release/app-release.apk "dist/${NAME}"
          cp app/build/outputs/mapping/release/mapping.txt "dist-mapping/${NAME%.apk}-mapping.txt"
          echo "name=${NAME}" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: dist/*.apk
          retention-days: 30
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: core-aar
          path: dist-aar/*.aar
          retention-days: 30
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: mapping
          path: dist-mapping/*-mapping.txt
          retention-days: 30
          if-no-files-found: error

