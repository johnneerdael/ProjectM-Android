// Floors for this release line. CI derives each patch/code from first-parent main history.
// Reset all three only for a planned new release line; routine PRs need no version bump.
def baseVersionName = "2.3.0"
def baseVersionCode = 49
def baseVersionCommit = "8b70620339018cfaf5ac05acdb4ea8104dc2eb59"

// Keep the default TV tasks and artifact paths stable for F-Droid and device tooling.
def touchscreen = providers.gradleProperty("androidTouchscreen").map { it.toBoolean() }.getOrElse(false)
def appLabel = touchscreen ? "ProjectM Android" : "ProjectM TV"
def distribution = providers.gradleProperty('projectmDistribution').getOrElse('github')
if (!(distribution in ['github', 'fdroid'])) {
    throw new GradleException('projectmDistribution must be github or fdroid')
}
def fdroid = distribution == 'fdroid'
def fdroidFlavor = touchscreen ? 'fdroidAndroid' : 'fdroidTv'
def overrideValue = { String property, String environment, String fallback ->
    def configured = providers.gradleProperty(property).orNull
    def supplied = System.getenv(environment)
    if (configured && supplied && configured != supplied) {
        throw new GradleException("Conflicting ${property} and ${environment}")
    }
    supplied ?: configured ?: fallback
}
def releaseVersion = overrideValue('projectmReleaseVersion', 'PROJECTM_RELEASE_VERSION', baseVersionName)
def releaseCode = overrideValue('projectmReleaseVersionCode', 'PROJECTM_RELEASE_VERSION_CODE', baseVersionCode.toString())
if (!(releaseVersion ==~ /\d+\.\d+\.\d+(-ci\.\d+)?/)) {
    throw new GradleException('Invalid projectmReleaseVersion')
}
if (!(releaseCode ==~ /[0-9]+/) || releaseCode.length() > 10 || releaseCode.toLong() < 1 || releaseCode.toLong() > 2100000000L) {
    throw new GradleException('Invalid projectmReleaseVersionCode: expected 1..2100000000')
}
ext.projectmResolvedReleaseVersion = providers.provider { releaseVersion }
ext.projectmResolvedReleaseTag = providers.provider { 'v' + releaseVersion.split('-')[0] }

apply plugin: 'com.android.application'

android {
    // Java package of the code; the installed app ID (applicationId below) is separate since 1.9.7.
    namespace "com.example.projectm.visualizer"
    compileSdkVersion 34
    // Pinned so local and CI builds use the same toolchain (preinstalled on GitHub's Ubuntu runners);
    // the app strips the engine's native library with it.
    ndkVersion "27.3.13750724"
    defaultConfig {
        applicationId touchscreen ? "nl.neerdael.projectm" : "nl.neerdael.projectmtv"
        buildConfigField "boolean", "TOUCHSCREEN", touchscreen.toString()
        buildConfigField "boolean", "FDROID", fdroid.toString()
        buildConfigField "String", "APK_PREFIX", touchscreen ? '"projectM-Android-"' : '"projectM-TV-"'
        manifestPlaceholders = [leanbackRequired: !touchscreen, touchscreenRequired: touchscreen,
                                appTheme: touchscreen ? "@style/Theme.Touchscreen" : "@style/Theme.Leanback"]
        resValue "string", "app_name", appLabel
        minSdkVersion 21
        targetSdkVersion 34
        testInstrumentationRunner "com.example.projectm.visualizer.MusicCategoryInstrumentation"
        versionCode = releaseCode.toInteger()
        versionName = releaseVersion + (System.getenv("VERSION_SUFFIX") ?: "")
    }
    signingConfigs {
        release {
            // Provided by CI (GitHub secrets) or your shell; see docs/RELEASING.md.
            def keystore = System.getenv("SIGNING_KEYSTORE_PATH")
            if (keystore) {
                storeFile file(keystore)
                storePassword System.getenv("SIGNING_STORE_PASSWORD")
                keyAlias System.getenv("SIGNING_KEY_ALIAS")
                keyPassword System.getenv("SIGNING_KEY_PASSWORD")
            }
        }
    }
    buildTypes {
        debug {
            if (project.hasProperty('presetLabDeviceTest') || project.hasProperty('setupScreenshotTest')) {
                def setupTest = project.hasProperty('setupScreenshotTest')
                applicationIdSuffix setupTest ? ".setuptest" : ".presettest"
                versionNameSuffix setupTest ? "-setuptest" : "-presettest"
                resValue "string", "app_name", setupTest ? "${appLabel} · Setup test" : "${appLabel} · Preset test"
            }
        }
        release {
            // R8 shrinks, optimizes and obfuscates; retrace crash traces with the release's mapping.txt.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Use the release key when configured, otherwise the local debug key, so
            // `./gradlew assembleRelease` always produces an installable, non-debuggable APK.
            signingConfig System.getenv("SIGNING_KEYSTORE_PATH") ? signingConfigs.release : signingConfigs.debug
        }
        // Release code, profileable by simpleperf (src/profile/AndroidManifest.xml), installed next
        // to the real app: `./gradlew assembleProfile`, see docs/PROFILING.md.
        profile {
            initWith release
            signingConfig signingConfigs.debug
            applicationIdSuffix ".profile"
            matchingFallbacks = ['release']
        }
    }
    buildFeatures {
        buildConfig true
    }
    // Named flavors only for F-Droid's per-device metadata selection; GitHub paths stay stable.
    if (fdroid) {
        flavorDimensions 'distribution'
        productFlavors {
            create(fdroidFlavor) {
                dimension 'distribution'
                applicationId touchscreen ? 'nl.neerdael.projectm' : 'nl.neerdael.projectmtv'
            }
        }
        sourceSets.getByName(fdroidFlavor).manifest.srcFile 'src/fdroid/AndroidManifest.xml'
    }
    sourceSets.main.java.srcDir "src/${distribution}/java"
    sourceSets.test.java.srcDir fdroid ? 'src/testFdroid/java' : 'src/testGithub/java'
    if (touchscreen) {
        [sourceSets.debug, sourceSets.release, sourceSets.profile].each { it.res.srcDir "src/touch/res" }
        sourceSets.debug.manifest.srcFile "src/touch/AndroidManifest.xml"
        sourceSets.release.manifest.srcFile "src/touch/AndroidManifest.xml"
        // Profile keeps its profileable overlay and receives the touch overlay too.
        sourceSets.profile.manifest.srcFile "src/touchProfile/AndroidManifest.xml"
    }
    testOptions {
        // android.util.Log etc. return defaults in JVM unit tests
        unitTests.returnDefaultValues = true
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    // No encrypted dependency list in the APK signing block: only Google Play can read it, and
    // F-Droid's scanner rejects APKs that carry it.
    dependenciesInfo {
        includeInApk = false
        includeInBundle = false
    }
}

dependencies {
    implementation project(':core')
    // Maintained QR encoder for the TV upload dialog; no camera/AndroidX integration.
    implementation 'com.google.zxing:core:3.5.4'
    // Framework UI and the standalone QR encoder; no AndroidX runtime dependencies.
    testImplementation 'junit:junit:4.13.2'
}
