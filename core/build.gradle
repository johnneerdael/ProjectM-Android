def renderingPolicy = providers.gradleProperty('projectmCoreRenderingPolicy').getOrElse('native')
if (renderingPolicy == 'capped') {
    throw new GradleException("The capped core artifact is retired. Build :core without projectmCoreRenderingPolicy or with -PprojectmCoreRenderingPolicy=native.")
}
if (renderingPolicy != 'native') {
    throw new GradleException("projectmCoreRenderingPolicy must be 'native' (got '${renderingPolicy}')")
}

def distribution = providers.gradleProperty('projectmDistribution').getOrElse('github')
if (!(distribution in ['github', 'fdroid'])) throw new GradleException('projectmDistribution must be github or fdroid')
apply plugin: 'com.android.library'
def generatedDistribution = layout.buildDirectory.dir('generated/preset-distribution')
def starterTask
if (distribution == 'fdroid') {
    def releaseTag = providers.provider { project(':app').projectmResolvedReleaseTag.get() }
    starterTask = tasks.register('generateStarterPresets', Exec) {
        inputs.files(rootProject.fileTree('core/src/main/assets'), rootProject.fileTree('tools/preset-distribution'))
        inputs.files(rootProject.file('tools/preset_distribution.py'), rootProject.file('tools/gen-preset-index.py'),
                rootProject.file('tools/check-presets.py'), rootProject.file('LICENSE'),
                rootProject.file('LICENSES/CC0-1.0.txt'), rootProject.file('docs/THIRD_PARTY.md'))
        inputs.property('releaseTag', releaseTag)
        outputs.dir(generatedDistribution)
        workingDir rootProject.projectDir
        doFirst {
            commandLine 'python3', rootProject.file('tools/preset_distribution.py'), 'build', '--root', rootProject.projectDir,
                    '--selection', rootProject.file('tools/preset-distribution/starter-presets.json'),
                    '--output', generatedDistribution.get().asFile, '--release-tag', releaseTag.get()
        }
    }
}

android {
    namespace = "nl.neerdael.projectm.core"
    // Compile the pinned crash reporter into the published AAR; no prebuilt dependency.
    sourceSets.main.java.srcDir rootProject.file("third_party/xcrash/xcrash_lib/src/main/java")
    compileSdk = 34
    ndkVersion = "27.3.13750724"
    buildFeatures {
        buildConfig = true
    }
    if (distribution == 'fdroid') {
        sourceSets.main.assets.setSrcDirs([generatedDistribution.get().dir('starter-assets').asFile])
    }
    defaultConfig {
        minSdk = 21
        consumerProguardFiles "consumer-rules.pro"
        buildConfigField 'String', 'RENDERING_POLICY', '"' + renderingPolicy + '"'
        buildConfigField 'boolean', 'SUPPORTS_NATIVE_RENDERING', 'true'
        externalNativeBuild {
            cmake {
                arguments "-DPROJECTMTV_RENDERING_POLICY=${renderingPolicy}"
                cppFlags "-std=c++17"
            }
        }
        ndk {
            abiFilters "armeabi-v7a", "arm64-v8a"
        }
    }
    testOptions {
        // android.util.Log etc. return defaults in JVM unit tests
        unitTests.returnDefaultValues = true
        unitTests.all {
            systemProperty 'projectmCoreRenderingPolicy', renderingPolicy
        }
    }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }
    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version = "3.22.1"
        }
    }
}

if (starterTask != null) tasks.named('preBuild').configure { dependsOn(starterTask) }

dependencies {
    testImplementation 'junit:junit:4.13.2'
}
